<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg6" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#FCF9FA"/>
      <stop offset="50%" stop-color="#F7ECEE"/>
      <stop offset="100%" stop-color="#E8D5D9"/>
    </radialGradient>
    <linearGradient id="pastelRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D8DC"/>
      <stop offset="40%" stop-color="#E5BEC5"/>
      <stop offset="80%" stop-color="#CCA1AB"/>
      <stop offset="100%" stop-color="#B28791"/>
    </linearGradient>
    <linearGradient id="pastelHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#B28791" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#8C5C68" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg6)"/>

  <!-- Mannequin Stature Silhouette -->
  <path d="M 220 540 C 220 480, 240 450, 300 450 C 360 450, 380 480, 380 540 L 450 780 L 150 780 Z" fill="#E2CFD4" opacity="0.45"/>
  <ellipse cx="300" cy="380" rx="95" ry="125" fill="#EADDE0" opacity="0.75"/>

  <!-- Seamless Tube Cap Structure -->
  <g filter="url(#shadow6)">
    <!-- Sleek Form Fitting Contour -->
    <path d="M 185 340 C 170 215, 235 140, 300 140 C 365 140, 430 215, 415 340 C 410 405, 395 445, 370 465 C 335 488, 265 488, 230 465 C 205 445, 190 405, 185 340 Z" fill="url(#pastelRose)"/>
    <path d="M 190 320 C 180 220, 240 150, 300 150 C 355 150, 410 190, 410 290 C 350 230, 260 220, 190 320 Z" fill="url(#pastelHighlight)"/>

    <!-- Subtle Elastic Gathering at Base -->
    <path d="M 215 450 C 245 470, 355 470, 385 450 C 390 460, 375 475, 355 482 C 325 490, 275 490, 245 482 C 225 475, 210 460, 215 450 Z" fill="#A87782" stroke="#BD8C97" stroke-width="1"/>
    
    <!-- Laser Cut Clean Hem Line -->
    <path d="M 205 425 Q 300 455 395 425" stroke="#CCA1AB" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 220 380 Q 300 405 380 380" stroke="#CCA1AB" stroke-width="1.8" fill="none" opacity="0.5"/>
  </g>

  <!-- Title Pill Overlay -->
  <g transform="translate(300, 720)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#FFFFFF" opacity="0.9" filter="url(#shadow6)"/>
    <text x="0" y="4" text-anchor="middle" font-family="serif" font-size="14" font-weight="600" fill="#171411" letter-spacing="1">
      LUXE SEAMLESS TUBE CAP
    </text>
    <text x="0" y="24" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="500" fill="#B28791" letter-spacing="2">
      PASTEL BLUSH • ZERO PRESSURE
    </text>
  </g>
</svg>
