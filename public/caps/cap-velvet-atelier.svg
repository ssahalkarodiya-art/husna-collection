<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="50%" stop-color="#F2ECE4"/>
      <stop offset="100%" stop-color="#E2D4C3"/>
    </radialGradient>
    <linearGradient id="velvetBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C4033"/>
      <stop offset="30%" stop-color="#4A3125"/>
      <stop offset="70%" stop-color="#342017"/>
      <stop offset="100%" stop-color="#24150E"/>
    </linearGradient>
    <linearGradient id="velvetLuster" x1="20%" y1="0%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#D9A982" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="gold5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C875"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2B1810" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg5)"/>

  <!-- Mannequin Stature Silhouette -->
  <path d="M 220 540 C 220 480, 240 450, 300 450 C 360 450, 380 480, 380 540 L 450 780 L 150 780 Z" fill="#DBCABE" opacity="0.45"/>
  <ellipse cx="300" cy="380" rx="95" ry="125" fill="#E6D9CD" opacity="0.75"/>

  <!-- Velvet Slouch Cap Body -->
  <g filter="url(#shadow5)">
    <path d="M 175 340 C 160 205, 230 135, 300 135 C 370 135, 440 205, 425 340 C 420 410, 400 450, 375 470 C 340 495, 260 495, 225 470 C 200 450, 180 410, 175 340 Z" fill="url(#velvetBrown)"/>
    <path d="M 180 320 C 170 220, 235 150, 300 150 C 355 150, 410 190, 420 280 C 360 220, 260 210, 180 320 Z" fill="url(#velvetLuster)"/>

    <!-- Velvet Folds -->
    <path d="M 210 440 Q 300 470 390 440" stroke="#6E4D3D" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M 225 400 Q 300 430 375 400" stroke="#6E4D3D" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M 240 360 Q 300 385 360 360" stroke="#6E4D3D" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Finished Hem Band -->
    <path d="M 205 455 C 235 475, 365 475, 395 455 C 400 465, 385 482, 365 490 C 330 500, 270 500, 235 490 C 215 482, 200 465, 205 455 Z" fill="#24150E" stroke="#4A3125" stroke-width="1.2"/>
  </g>

  <!-- Gold Atelier Threadwork Motif -->
  <g transform="translate(280, 460)">
    <path d="M 0 0 C 10 -8, 30 -8, 40 0 C 30 8, 10 8, 0 0 Z" fill="url(#gold5)"/>
    <circle cx="20" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Title Pill Overlay -->
  <g transform="translate(300, 720)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#FFFFFF" opacity="0.9" filter="url(#shadow5)"/>
    <text x="0" y="4" text-anchor="middle" font-family="serif" font-size="14" font-weight="600" fill="#171411" letter-spacing="1">
      VELVET MODEST ATELIER CAP
    </text>
    <text x="0" y="24" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="500" fill="#5C4033" letter-spacing="2">
      MOCHA BROWN • PLUSH STRETCH
    </text>
  </g>
</svg>
